name: Native protocol suites

on:
  pull_request:
    paths:
      - 'test/corpus/**'
      - 'test/test_protocol.cpp'
      - 'test/test_registry.h'
      - 'test/test_suite_main.cpp'
      - 'src/protocol/**'
      - 'src/controller/**'
      - 'src/radio/**'
      - 'src/*.xml'
      - 'src/*.js'
      - 'test/Makefile'
      - 'test/test_channel_ui.py'
      - 'test/test_sx1262_device_errors.cpp'
      - 'test/test_sx1262_iohome_phy.cpp'
      - '.github/workflows/golden-rf-corpus.yml'
  push:
    branches: [v1dev]
    paths:
      - 'test/corpus/**'
      - 'test/test_protocol.cpp'
      - 'test/test_registry.h'
      - 'test/test_suite_main.cpp'
      - 'src/protocol/**'
      - 'src/controller/**'
      - 'src/radio/**'
      - 'src/*.xml'
      - 'src/*.js'
      - 'test/Makefile'
      - 'test/test_channel_ui.py'
      - 'test/test_sx1262_device_errors.cpp'
      - 'test/test_sx1262_iohome_phy.cpp'
      - '.github/workflows/golden-rf-corpus.yml'

permissions:
  contents: read

jobs:
  native-suite:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        suite: [protocol, controller, exchange, radio, ui]
    steps:
      - uses: actions/checkout@v4
      - name: Run ${{ matrix.suite }} suite
        run: make -C test check-${{ matrix.suite }}
  golden-rf-corpus:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate golden RF corpus
        run: make -C test corpus
